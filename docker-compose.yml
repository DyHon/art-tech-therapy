version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: arttech_therapy_db
    restart: always
    environment:
      POSTGRES_USER: therapy_user
      POSTGRES_PASSWORD: therapy_secure_password_2026
      POSTGRES_DB: arttech_therapy
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U therapy_user -d arttech_therapy']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
